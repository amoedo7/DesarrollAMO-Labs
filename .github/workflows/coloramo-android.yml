name: ColorAMO Android CI
on:
  pull_request:
    paths: ['apps/ColorAMO/**', '.github/workflows/coloramo-android.yml']
  push:
    branches: [main]
    paths: ['apps/ColorAMO/**', '.github/workflows/coloramo-android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ColorAMO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: gradle testDebugUnitTest assembleDebug --no-daemon
      - run: |
          cp app/build/outputs/apk/debug/app-debug.apk ColorAMO-v0.1.0-debug.apk
          sha256sum ColorAMO-v0.1.0-debug.apk > ColorAMO-v0.1.0-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ColorAMO-v0.1.0
          path: |
            apps/ColorAMO/ColorAMO-v0.1.0-debug.apk
            apps/ColorAMO/ColorAMO-v0.1.0-debug.apk.sha256
